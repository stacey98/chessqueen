<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Reps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=block&text=%E2%99%94%E2%99%95%E2%99%96%E2%99%97%E2%99%98%E2%99%99%E2%99%9A%E2%99%9B%E2%99%9C%E2%99%9D%E2%99%9E%E2%99%9F">
<style>
:root {
  /* Layout: home = intro, mixed-reps strip, then two side-by-side columns (As White / As Black) of opening rows.
     Trainer = board on the left, coach panel on the right; stacks to one column under 900px. */
  --bg: #e9ecf0;
  --surface: #fafbfc;
  --surface-2: #e0e5eb;
  --ink: #131820;
  --muted: #586375;
  --line: #cfd6df;
  --accent: #985a12;
  --accent-ink: #ffffff;
  --accent-soft: rgba(152, 90, 18, .12);
  --good: #2a7849;
  --good-soft: rgba(42, 120, 73, .12);
  --bad: #b13a3a;
  --bad-soft: rgba(177, 58, 58, .11);
  --sq-light: #dfe5ec;
  --sq-dark: #7189a3;
  --hl: rgba(238, 178, 58, .48);
  --sel: rgba(238, 178, 58, .78);
  --dot: rgba(19, 24, 32, .30);
  --arrow: rgba(212, 128, 20, .9);
  --wp-fill: #fbfaf6;
  --wp-line: #151a21;
  --bp-fill: #191d24;
  --bp-line: #56627a;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --f-piece: "Noto Sans Symbols 2", "Segoe UI Symbol", "DejaVu Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --surface: #151a21; --surface-2: #1d242d; --ink: #e5e8ed; --muted: #97a1b0; --line: #28303a;
    --accent: #e3a54e; --accent-ink: #1b1206; --accent-soft: rgba(227, 165, 78, .14);
    --good: #5bb37f; --good-soft: rgba(91, 179, 127, .14); --bad: #e27474; --bad-soft: rgba(226, 116, 116, .14);
    --sq-light: #c2cbd6; --sq-dark: #5d728b; --dot: rgba(10, 13, 18, .36);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #151a21; --surface-2: #1d242d; --ink: #e5e8ed; --muted: #97a1b0; --line: #28303a;
  --accent: #e3a54e; --accent-ink: #1b1206; --accent-soft: rgba(227, 165, 78, .14);
  --good: #5bb37f; --good-soft: rgba(91, 179, 127, .14); --bad: #e27474; --bad-soft: rgba(226, 116, 116, .14);
  --sq-light: #c2cbd6; --sq-dark: #5d728b; --dot: rgba(10, 13, 18, .36);
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }

/* Top bar */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: .01em; text-decoration: none; }
.brand-mark { width: 22px; height: 22px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; border-radius: 4px; overflow: hidden; }
.brand-mark i:nth-child(1), .brand-mark i:nth-child(4) { background: var(--sq-dark); }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(3) { background: var(--accent); }
.top-stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Home */
.home { display: flex; flex-direction: column; gap: 28px; padding-block: 32px 48px; }
.intro { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.intro h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 4.6vw, 46px); line-height: 1.06; letter-spacing: -.01em; text-wrap: balance; max-width: 22ch; }
.intro p { margin: 0; max-width: 64ch; color: var(--muted); font-size: 16px; }
.mix { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.mix-text { flex: 1 1 260px; min-width: 0; }
.mix-text strong { font-family: var(--f-display); font-size: 17px; display: block; }
.mix-text span { color: var(--muted); font-size: 14px; }
.mix-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.groups { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 860px) { .groups { grid-template-columns: 1fr; } }
.group { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.group-h h2 { margin: 0; font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.op-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; transition: border-color .15s, transform .15s; }
.op-row:hover { border-color: var(--accent); }
.op-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.op-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.op-name h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.15; }
.eco { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .03em; }
.op-seq { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.op-blurb { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--muted); }
.op-prog { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; grid-row: 1 / span 2; grid-column: 2; }
.op-count { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.op-count b { color: var(--ink); font-weight: 600; }
.pips { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 180px; }
.pip { width: 12px; height: 6px; border-radius: 2px; background: var(--surface-2); }
.pip.seen { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.pip.s1 { background: var(--accent); opacity: .45; box-shadow: none; }
.pip.s2 { background: var(--accent); opacity: .75; box-shadow: none; }
.pip.s3 { background: var(--good); }
.foot { font-size: 13px; color: var(--muted); max-width: 70ch; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 16px; }
.foot p { margin: 0; }

/* Buttons */
.btn { font: 600 14px/1.2 var(--f-body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn kbd { font-family: var(--f-mono); font-size: 11px; opacity: .7; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* Trainer */
.trainer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 24px; padding-block: 20px 40px; align-items: start; }
@media (max-width: 900px) { .trainer { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 32px; } }
.board-col { display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
.board-wrap { position: relative; width: min(100%, 640px, calc(100dvh - 120px)); min-width: 260px; max-width: 100%; aspect-ratio: 1; }
@media (max-width: 900px) { .board-wrap { width: min(100%, 560px); min-width: 0; } }
.board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); container-type: inline-size; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 6px; box-shadow: 0 1px 0 var(--line), 0 10px 30px rgba(15, 20, 30, .18); cursor: pointer; }
.sq { position: relative; }
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq:nth-child(1) { border-top-left-radius: 6px; }
.sq:nth-child(8) { border-top-right-radius: 6px; }
.sq:nth-child(57) { border-bottom-left-radius: 6px; }
.sq:nth-child(64) { border-bottom-right-radius: 6px; }
.sq.last { box-shadow: inset 0 0 0 100vmax var(--hl); }
.sq.sel { box-shadow: inset 0 0 0 100vmax var(--sel); }
.sq.bad { box-shadow: inset 0 0 0 100vmax rgba(205, 55, 55, .55); }
.sq.chk { background-image: radial-gradient(circle, rgba(225, 40, 40, .9) 0%, rgba(225, 40, 40, .45) 42%, transparent 72%); }
.sq.tgt::before { content: ""; position: absolute; inset: 37%; border-radius: 50%; background: var(--dot); z-index: 1; }
.sq.tgt.cap::before { inset: 5%; background: transparent; border: 0.75cqw solid var(--dot); }
.co { position: absolute; font-family: var(--f-mono); font-weight: 500; font-size: 2.1cqw; line-height: 1; pointer-events: none; z-index: 1; }
.co.r { top: 5%; left: 6%; }
.co.f { bottom: 5%; right: 7%; }
.sq.l .co { color: var(--sq-dark); }
.sq.d .co { color: var(--sq-light); }
.pc { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-piece); font-size: 40px; font-size: 10.4cqw; line-height: 1; pointer-events: none; z-index: 2; filter: drop-shadow(0 0.25cqw 0.15cqw rgba(0, 0, 0, .22)); }
.pc::before, .pc::after { grid-area: 1 / 1; }
.pc.c-w::before { color: var(--wp-fill); }
.pc.c-w::after { color: var(--wp-line); }
.pc.c-b::before { color: var(--bp-fill); }
.pc.c-b::after { color: var(--bp-line); }
.pc.t-k::before { content: "\265A\FE0E"; } .pc.t-k::after { content: "\2654\FE0E"; }
.pc.t-q::before { content: "\265B\FE0E"; } .pc.t-q::after { content: "\2655\FE0E"; }
.pc.t-r::before { content: "\265C\FE0E"; } .pc.t-r::after { content: "\2656\FE0E"; }
.pc.t-b::before { content: "\265D\FE0E"; } .pc.t-b::after { content: "\2657\FE0E"; }
.pc.t-n::before { content: "\265E\FE0E"; } .pc.t-n::after { content: "\2658\FE0E"; }
.pc.t-p::before { content: "\265F\FE0E"; } .pc.t-p::after { content: "\2659\FE0E"; }
.pc.dragging { z-index: 30; filter: drop-shadow(0 1.2cqw 1cqw rgba(0, 0, 0, .3)); }
#arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
.ar-l { stroke: var(--arrow); stroke-width: .17; stroke-linecap: round; fill: none; }
.ar-h { fill: var(--arrow); }
.board-meta { width: min(100%, 640px); display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }

.coach { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.coach-head { display: flex; flex-direction: column; gap: 6px; }
.crumb { font-size: 13px; color: var(--muted); text-decoration: none; }
.crumb:hover { color: var(--ink); }
.coach-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 25px; line-height: 1.1; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.side-w { background: #f4f2ec; color: #1a1d22; box-shadow: inset 0 0 0 1px #c9c4b6; }
.chip.side-b { background: #1d2129; color: #eef0f3; }
.line-label { font-size: 13px; color: var(--muted); }
.line-label b { color: var(--ink); font-weight: 600; }
.status { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.st-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.st-t { font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.25; }
.st-s { font-size: 14px; color: var(--muted); }
.status.good { background: var(--good-soft); } .status.good .st-dot { background: var(--good); }
.status.bad { background: var(--bad-soft); } .status.bad .st-dot { background: var(--bad); }
.status.teach, .status.shown { background: var(--accent-soft); } .status.teach .st-dot, .status.shown .st-dot { background: var(--accent); }
.status.turn .st-dot { background: var(--ink); }
.status.wait .st-dot { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.feed { display: flex; flex-direction: column; gap: 10px; min-height: 64px; }
.fe { display: flex; flex-direction: column; gap: 2px; }
.fe-h { font-size: 13px; color: var(--muted); }
.fe-h .mv { font-family: var(--f-mono); font-weight: 500; color: var(--accent); font-size: 13.5px; }
.fe p { margin: 0; font-size: 14.5px; }
.fe.preview { padding-left: 10px; border-left: 2px solid var(--accent); }
.moves { font-family: var(--f-mono); font-size: 13.5px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-height: 42px; line-height: 1.9; display: flex; flex-wrap: wrap; column-gap: 12px; }
.moves .pair { white-space: nowrap; }
.moves .num { color: var(--muted); margin-right: 3px; }
.moves .cur { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .grow { margin-left: auto; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.sess { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font: 600 14px var(--f-body); color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpane { max-height: 380px; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.ln { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.ln:last-child { border-bottom: 0; }
.ln.now .ln-name::after { content: "  · now"; color: var(--accent); font-weight: 500; }
.ln-name { font-weight: 600; font-size: 14px; }
.ln-seq { grid-column: 1 / -1; font-family: var(--f-mono); font-size: 12px; color: var(--muted); line-height: 1.6; }
.ln-side { display: flex; align-items: center; gap: 8px; }
.dots3 { display: flex; gap: 3px; }
.dots3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.dots3 i.on { background: var(--accent); box-shadow: none; }
.dots3.full i { background: var(--good); box-shadow: none; }
.mini { font: 600 12.5px var(--f-body); padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.mini:hover { border-color: var(--accent); }
.ideas { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
.pane-foot { position: sticky; bottom: 0; background: var(--surface); padding-block: 10px 4px; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 13px; }
.err { padding: 16px; margin: 24px 0; border-radius: 10px; background: var(--bad-soft); color: var(--ink); }
.check-note { font-size: 12.5px; color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .status.wait .st-dot { animation: none; } }

/* v3: tree trainer additions */
:root { --threat: rgba(196, 52, 52, .85); --focus: rgba(40, 120, 220, .9); }
.th-l { stroke: var(--threat); stroke-width: .07; stroke-dasharray: .16 .1; stroke-linecap: round; fill: none; }
.th-h { fill: var(--threat); }
.fo-c { fill: none; stroke: var(--focus); stroke-width: .07; }
.evalbar { width: min(100%, 640px); display: flex; flex-direction: column; gap: 4px; }
.evaltrack { height: 8px; border-radius: 999px; background: var(--bp-fill); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.evalfill { height: 100%; background: var(--wp-fill); transition: width .3s ease; box-shadow: inset 0 0 0 1px var(--line); }
.evaltrack.flip { background: var(--wp-fill); }
.evaltrack.flip .evalfill { background: var(--bp-fill); }
.evaltxt { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { width: min(100%, 640px); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px dashed var(--threat); vertical-align: middle; margin-right: 5px; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--focus); vertical-align: middle; margin-right: 5px; }
.tagchip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; background: var(--surface-2); color: var(--muted); }
.tagchip.best, .tagchip.top { background: var(--good-soft); color: var(--good); }
.tagchip.mistake { background: var(--bad-soft); color: var(--bad); }
.tagchip.inaccuracy { background: var(--accent-soft); color: var(--accent); }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; width: 150px; max-width: 100%; display: flex; }
.bar .k { background: var(--good); } .bar .s { background: var(--accent); opacity: .55; }
.ln-chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.ln-chip.known { background: var(--good-soft); color: var(--good); }
.ln-chip.learning { background: var(--accent-soft); color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0 4px; }
.filters .mini[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
</style>

<div id="app"><div class="wrap"><p class="muted" style="padding-block:40px">Loading the board…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
/* ------------------------------------------------------------------
   Hand-written seed lines. Each line is a sequence of moves in standard
   notation; text in {braces} explains the move right before it.
   "side" is the side YOU play. builder\build.ps1 reads these lines and
   grows the full engine-checked trees into trees.json (published next
   to this page). If trees.json can't load, the page falls back to these.
   Keep the  id: "..", name: "..", side: ".."  and
   { name: "..", pgn: `..` }  formats: the builder parses them.
------------------------------------------------------------------- */
const OPENINGS = [
{
  id: "italian", name: "Italian Game", side: "w", eco: "C50–C54", seq: "1.e4 e5 2.Nf3 Nc6 3.Bc4",
  blurb: "Quick development, a bishop aimed at f7, then a slow, solid build-up with c3 and d3.",
  plan: [
    "Bc4 aims at f7, the square only Black's king defends.",
    "c3 and d3 make a solid center and prepare a later d4.",
    "Castle, play Re1, then bring the last knight over with Nbd2–f1–g3.",
    "Never grab with Nxe5 when Black has just played ...Nd4. That is a trap."

  lines: [

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- Building the trees ---------- */
// Fallback when trees.json can't load: turn the hand-written lines into the same tree format.
function curatedTree(op) {
  const root = { c: [] };
  for (const raw of op.lines) {
    const g = new Chess(); let cur = root;
    for (const m of parsePgn(raw.pgn)) {
      const r = g.move(m.san);
      if (!r) { CHECK.errors.push(`${op.name} / ${raw.name}: "${m.san}" is not legal`); break; }
      const u = r.from + r.to + (r.promotion || "");
      cur.c = cur.c || [];
      let k = cur.c.find(x => x.u === u);
      if (!k) { k = { u, t: r.color === op.side ? "book" : "sideline", n: m.note }; cur.c.push(k); }
      else if (!k.n && m.note) k.n = m.note;
      cur = k;
    }
  }
  return root.c;
}
function group(name) { const i = name.indexOf(":"); return i > 0 ? name.slice(0, i) : name; }
function commonGroup(names) { const gs = [...new Set(names.map(group))]; return gs.length === 1 ? gs[0] : "Main line"; }

  let base = "", baseIdx = -1;
  for (let i = path.length - 1; i >= 0; i--) { const nm = path[i].names; if (nm.length) { base = nm.length === 1 ? nm[0] : commonGroup(nm); baseIdx = i; break; } }
  const dev = path[baseIdx + 1];
  const devTxt = dev ? moveLabel(dev.ply - 1, dev.san) : "";
  if (!base) return "Sideline " + devTxt;
  return devTxt ? `${base} → ${devTxt}` : base;
}
function buildOpening(op, tree) {
  const root = { id: op.id, path: "", kids: [], ply: 0, names: [] };
  const nodes = []; const g = new Chess();
  (function walk(list, parent) {
    for (const j of list || []) {
      const r = g.move({ from: j.u.slice(0, 2), to: j.u.slice(2, 4), promotion: j.u[4] || "q" });
      if (!r) { CHECK.errors.push(`${op.name}: illegal move ${j.u} after "${parent.path.trim() || "start"}"`); continue; }
      const path = parent.path + " " + j.u;
      const n = { id: op.id + ":" + fnv(path), path, uci: j.u, san: r.san, from: r.from, to: r.to, color: r.color, ply: parent.ply + 1,
                  note: j.n || "", tag: j.t || "", e: j.e, w: j.w == null ? 1 : j.w, rank: j.r || 0, loss: j.l, parent, kids: [], names: [] };
      parent.kids.push(n); nodes.push(n);
      walk(j.c, n);
      g.undo();
    }
  })(tree, root);
  for (const raw of op.lines) {
    const g2 = new Chess(); let cur = root;
    for (const m of parsePgn(raw.pgn)) {
      const r = g2.move(m.san); if (!r) break;
      const u = r.from + r.to;
      const k = cur.kids.find(x => x.uci.slice(0, 4) === u); if (!k) break;
      k.names.push(raw.name); cur = k;
    }
  }
  const lines = [], seen = new Set();
  for (const n of nodes) {
    if (n.kids.length) continue;
    const path = []; let x = n; while (x && x !== root) { path.unshift(x); x = x.parent; }
    while (path.length && path[path.length - 1].color !== op.side) path.pop();
    if (!path.length) continue;
    const last = path[path.length - 1];
    if (seen.has(last.id)) continue; seen.add(last.id);
    const userNodes = path.filter(p => p.color === op.side);
    let prob = 1; for (const p of path) if (p.color !== op.side) prob *= p.w;
    lines.push({ id: last.id, op, nodes: path, userNodes, prob, name: lineName(path) });
  }
  lines.sort((a, b) => b.prob - a.prob);
  const um = new Map(); lines.forEach(l => l.userNodes.forEach(u => um.set(u.id, u)));
  return { op, root, nodes, lines, userNodes: [...um.values()] };
}

function kn(id) { return K[id] || (K[id] = { s: 0, k: 0, n: 0, t: 0 }); }
function kp(id) { return K[id] || { s: 0, k: 0, n: 0, t: 0 }; }

}

const TAG = {

function noteFor(n) {

        threats: [], focus: [], badSq: null, lastId: null, feed: [], result: null, evalCp: 20, session: { reps: 0, clean: 0 },
        tab: "lines", filter: "all", drag: null, sqEls: {}, resetArmed: false, status: { kind: "wait" } };

function pickLine(pool, lastId) {

    return { l, weak, fresh, oldest };

  if (weak.length && (Math.random() < 0.65 || !fresh.length)) { cand = weak; wf = x => x.l.prob * (1 + x.weak); }
  else if (fresh.length) { fresh.sort((a, b) => b.l.prob - a.l.prob || a.fresh - b.fresh); cand = fresh.slice(0, 3); wf = x => x.l.prob; }
  else { const now = Date.now(); cand = info; wf = x => x.l.prob * (1 + (now - x.oldest) / 36e5 / 12); }
  let tot = 0; for (const x of cand) tot += wf(x);
  let r = Math.random() * tot; for (const x of cand) { r -= wf(x); if (r <= 0) return x.l; }
  return cand[cand.length - 1].l;
}

function startRep(forced) {
  if (!T) return;
  if (T.pending) { clearTimeout(T.pending); T.pending = null; }
  const line = forced || pickLine(T.pool, T.lastId);
  const sideChanged = !T.line || T.side !== line.op.side;
  T.line = line; T.nodes = line.nodes; T.side = line.op.side; T.lastId = line.id;
  T.game.reset(); T.ply = 0; T.mistakes = 0; T.wrong = 0; T.learned = 0; T.assisted = !!prefs.arrows; T.done = false;
  T.last = null; T.selected = null; T.targets = []; T.result = null; T.badSq = null; T.threats = []; T.focus = []; T.feed = []; T.punish = false; T.evalCp = 20;
  if (sideChanged || !T.sqEls.a1) buildBoard();
  renderHead(); renderTab();
  step(false);
}

function step(keepStatus) {
  if (!T) return;
  if (T.ply >= T.nodes.length) return finish();
  const m = T.nodes[T.ply];
  if (m.color === T.side) {
    T.wrong = 0; T.hintNow = false;
    T.newNode = !kp(m.id).s;
    T.arrowNow = T.newNode || !!prefs.arrows;
    if (!keepStatus || T.newNode) setStatus(T.newNode ? "teach" : T.punish ? "punish" : "turn");
    renderAll();
  } else {
    if (!keepStatus) setStatus("wait");
    renderAll();
    T.pending = setTimeout(() => { T.pending = null; playOpp(m); }, T.ply === 0 ? 500 : 600);
  }
}

function afterMove(m) {
  T.last = { from: m.from, to: m.to };
  T.threats = threatsOf(m.to, m.color).slice(0, 3);
  T.focus = squaresIn(m.note);
  if (m.e != null) T.evalCp = m.e;
}
function playOpp(m) {
  if (!T) return;
  T.game.move({ from: m.from, to: m.to, promotion: m.uci[4] || "q" });
  afterMove(m);
  T.punish = m.tag === "mistake" || m.tag === "inaccuracy";
  T.feed.push({ who: SIDE[m.color], label: moveLabel(T.ply, m.san), text: noteFor(m), tag: m.forced ? "opening" : m.tag });
  T.ply++;
  renderBoard(); animate(m.from, m.to);
  step(false);
}

function userTry(from, to, anim) {
  const exp = T.nodes[T.ply];
  const mv = T.game.move({ from, to, promotion: "q" });
  T.selected = null; T.targets = [];
  if (!mv) { renderBoard(); return; }
  const r = kn(exp.id);
  if (mv.from === exp.from && mv.to === exp.to) {
    r.n++; r.t = Date.now();
    if (T.newNode) { if (!r.s) T.learned++; r.s = 1; }
    else if (T.wrong === 0 && !T.hintNow && !prefs.arrows) r.k++;
    save();
    afterMove(exp);
    T.feed.push({ who: "You", label: moveLabel(T.ply, mv.san), text: noteFor(exp), tag: exp.tag });
    T.ply++; T.arrowNow = false; T.punish = false;
    renderBoard(); if (anim) animate(from, to);
    setStatus(T.newNode ? "teachgood" : "good");
    step(true);
  } else {
    T.game.undo();
    T.wrong++;
    if (!T.newNode) { r.k = 0; r.t = Date.now(); if (T.wrong === 1) T.mistakes++; save(); }
    flashBad(to);
    if (T.wrong >= 2 || T.newNode) { T.arrowNow = true; setStatus("shown"); }
    else setStatus("bad", mv.san);
    renderAll();
  }
}

function finish() {
  T.done = true; T.focus = []; T.threats = T.threats || [];
  reps[T.line.op.id] = (reps[T.line.op.id] || 0) + 1;
  T.session.reps++;
  if (T.mistakes === 0 && !T.assisted && T.learned === 0) { T.result = "clean"; T.session.clean++; }
  else if (T.mistakes === 0 && T.learned > 0) T.result = "learned";
  else if (T.mistakes) T.result = "missed";
  else T.result = "assisted";
  save();
  setStatus("done");
  renderAll(); renderHead(); renderTab();
  const nb = document.getElementById("btn-next"); if (nb) nb.focus({ preventScroll: true });
}

function hint() {
  if (!canMove() || T.arrowNow) return;
  T.arrowNow = true; T.assisted = true; T.hintNow = true;
  const r = kn(T.nodes[T.ply].id); r.k = 0; save();
  setStatus("shown");
  renderAll();
}

/* ---------- Status ---------- */
function setStatus(kind, extra) { T.status = { kind, extra }; }
function statusHTML() {
  const s = T.status || { kind: "wait" };
  const exp = !T.done && T.nodes[T.ply];
  const opp = SIDE[T.side === "w" ? "b" : "w"];
  let cls = s.kind, t = "", sub = "";
  switch (s.kind) {
    case "turn": t = "Your move"; sub = T.ply === 0 ? `You play ${SIDE[T.side]}. Make your first move.` : "Find the best move."; break;
    case "punish": cls = "teach"; t = "Punish it"; sub = `${opp} made a mistake. Find the strongest reply.`; break;
    case "teach": t = `New move: play ${exp ? moveLabel(T.ply, exp.san) : ""}`; sub = "Follow the arrow this time. Next time it's a test."; break;
    case "teachgood": cls = "good"; t = "Good"; sub = `${opp} is replying…`; break;
    case "good": t = "Correct"; sub = `${opp} is replying…`; break;
    case "wait": t = `${opp} to move`; sub = "Watch the reply."; break;
    case "bad": t = "Not the best move"; sub = `${esc(s.extra || "")} isn't the move here. Try again. A second miss shows the answer.`; break;
    case "shown": t = `The move is ${exp ? moveLabel(T.ply, exp.san) : ""}`; sub = "Follow the arrow."; break;
    case "done": {
      const st = lineState(T.line);
      const tail = `You know ${st.known} of ${st.total} moves in this line.`;
      if (T.result === "learned") { cls = "teach"; t = `Learned ${T.learned} new move${T.learned > 1 ? "s" : ""}`; sub = "They come back as a test. " + tail; }
      else if (T.result === "clean") { cls = "good"; t = st.mastered ? "Clean rep. Line known" : "Clean rep"; sub = tail; }
      else if (T.result === "assisted") { cls = "turn"; t = "Line done, with help"; sub = "Hints or study mode were on, so moves don't count as known. " + tail; }
      else { cls = "bad"; t = `Line done, ${T.mistakes} mistake${T.mistakes > 1 ? "s" : ""}`; sub = "Missed moves come back soon. " + tail; }
      break;
    }
  }
  if (s.kind === "wait" || ((s.kind === "good" || s.kind === "teachgood") && T.pending)) cls += " wait";
  return `<div class="status ${cls}" role="status" aria-live="polite"><span class="st-dot"></span><div><div class="st-t">${t}</div><div class="st-s">${sub}</div></div></div>`;
}

/* ---------- Layout ---------- */
function renderShell() {

  <main class="wrap trainer">

}

function renderHead() {
  const op = T.line.op;
  const s = stats(T.datas);
  const showName = T.done;
  document.getElementById("head").innerHTML = `
    <a class="crumb" href="#">← All openings</a>

    <div class="chips"><span class="chip side-${T.side}">You play ${SIDE[T.side]}</span>${T.cfg.op ? "" : `<span class="chip">${esc(T.title)}</span>`}<span class="chip">${s.known} / ${s.total} moves known</span><span class="chip">${reps[op.id] || 0} reps</span></div>
    <div class="line-label">Line: ${showName ? `<b>${esc(T.line.name)}</b>` : "shown at the end"}</div>`;

}

function renderFeed() {
  const items = T.feed.slice(-2).map(f => `<div class="fe"><div class="fe-h">${f.who} played <span class="mv">${esc(f.label)}</span>${TAG[f.tag] ? `<span class="tagchip ${f.tag}">${TAG[f.tag][0]}</span>` : ""}</div>${f.text ? `<p>${esc(f.text)}</p>` : ""}</div>`);
  if (!T.done && T.arrowNow && canMove()) {
    const exp = T.nodes[T.ply], txt = noteFor(exp);
    if (txt) items.push(`<div class="fe preview"><div class="fe-h">Why <span class="mv">${esc(moveLabel(T.ply, exp.san))}</span></div><p>${esc(txt)}</p></div>`);
  }
  if (!items.length) items.push(`<div class="fe"><p class="muted">${T.side === "w" ? "You move first." : "White moves first. Watch the board."}</p></div>`);

}

function renderMoves() {
  const ms = T.nodes.slice(0, T.ply);
  let html = "";
  for (let i = 0; i < ms.length; i += 2) {
    const a = ms[i], b = ms[i + 1];
    html += `<span class="pair"><span class="num">${i / 2 + 1}.</span><span class="${i === T.ply - 1 ? "cur" : ""}">${a.san}</span>${b ? ` <span class="${i + 1 === T.ply - 1 ? "cur" : ""}">${b.san}</span>` : ""}</span>`;
  }
  document.getElementById("moves").innerHTML = html || `<span class="muted">Moves appear here.</span>`;
}

function renderEval() {
  const cp = T.evalCp == null ? 0 : Math.max(-1000, Math.min(1000, T.evalCp));
  const share = 50 + 50 * (2 / (1 + Math.exp(-cp / 250)) - 1);
  const track = document.getElementById("evaltrack");
  track.classList.toggle("flip", T.side === "b");
  document.getElementById("evalfill").style.width = share + "%";
  document.getElementById("eval-l").textContent = `Engine: ${fmtEval(T.evalCp)} (${evalWords(T.evalCp)})`;
  document.getElementById("eval-r").textContent = T.done ? `${T.nodes.length} moves in this line` : `Move ${Math.floor(T.ply / 2) + 1}${T.mistakes ? ` · ${T.mistakes} mistake${T.mistakes > 1 ? "s" : ""}` : ""}`;
}

function renderActions() {
  const el = document.getElementById("actions");
  if (T.done) el.innerHTML = `<button class="btn primary" id="btn-next" data-act="next">Next rep <kbd>Enter</kbd></button><button class="btn" data-act="restart">Repeat this line</button>`;
  else el.innerHTML = `<button class="btn" data-act="hint" ${canMove() && !T.arrowNow ? "" : "disabled"}>Hint <kbd>H</kbd></button><button class="btn" data-act="restart">Restart line</button><button class="btn grow" data-act="next">Skip</button>`;
}

function renderTab() {
  const op = T.line.op, d = D[op.id];
  document.getElementById("tab-lines").setAttribute("aria-selected", T.tab === "lines");
  document.getElementById("tab-ideas").setAttribute("aria-selected", T.tab === "ideas");
  const pane = document.getElementById("pane");
  if (T.tab === "ideas") {
    pane.innerHTML = `<p style="margin:12px 0 10px">${esc(op.blurb)}</p><ul class="ideas">${op.plan.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
    return;
  }
  const rows = d.lines.map(l => ({ l, st: lineState(l) })).filter(x =>
    T.filter === "all" || (T.filter === "new" && x.st.fresh) || (T.filter === "learning" && !x.st.fresh && !x.st.mastered) || (T.filter === "known" && x.st.mastered));
  const btn = (f, label) => `<button class="mini" data-filter="${f}" aria-pressed="${T.filter === f}">${label}</button>`;
  pane.innerHTML = `<div class="filters">${btn("all", "All " + d.lines.length)}${btn("new", "New")}${btn("learning", "Learning")}${btn("known", "Known")}</div>` +
    (rows.length ? rows.map(({ l, st }) => {
      const isNow = l.id === T.line.id && T.done;
      const chip = st.mastered ? `<span class="ln-chip known">Known</span>` : st.fresh ? `<span class="ln-chip">New</span>` : `<span class="ln-chip learning">${st.known}/${st.total}</span>`;
      const tail = l.nodes.slice(-6);
      const off = l.nodes.length - tail.length;
      const tailTxt = tail.map((m, i) => { const p = off + i; return (p % 2 === 0 ? `${p / 2 + 1}.` : (i === 0 ? `${Math.floor(p / 2) + 1}...` : "")) + m.san; }).join(" ");
      return `<div class="ln${isNow ? " now" : ""}">
        <div class="ln-name">${esc(l.name)}</div>
        <div class="ln-side">${chip}<button class="mini" data-act="practice" data-id="${esc(l.id)}">Drill</button></div>
        <div class="ln-seq">${off ? "… " : ""}${esc(tailTxt)}</div></div>`;
    }).join("") : `<p class="muted" style="padding:10px 0">No lines in this group yet.</p>`) +
    `<div class="pane-foot"><span class="muted">${stats([d]).linesM} of ${d.lines.length} lines fully known</span><button class="link" data-act="reset" id="btn-reset">Reset progress for ${esc(op.name)}</button></div>`;
}

function renderAll() { renderBoard(); renderOverlay(); document.getElementById("status").innerHTML = statusHTML(); renderFeed(); renderMoves(); renderActions(); renderEval(); }

/* ---------- Board ---------- */
function buildBoard() {
  const b = document.getElementById("board");
  b.innerHTML = ""; T.sqEls = {};
  const flip = T.side === "b";
  for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
    const f = flip ? 7 - col : col, rank = flip ? row + 1 : 8 - row;
    const sq = FILES[f] + rank;
    const el = document.createElement("div");
    const base = "sq " + ((f + rank - 1) % 2 === 0 ? "d" : "l");
    el.className = base; el.dataset.base = base; el.dataset.sq = sq;
    if (col === 0) el.insertAdjacentHTML("beforeend", `<span class="co r">${rank}</span>`);
    if (row === 7) el.insertAdjacentHTML("beforeend", `<span class="co f">${FILES[f]}</span>`);
    b.appendChild(el); T.sqEls[sq] = el;
  }
}
function dispPos(sq) { const f = FILES.indexOf(sq[0]), rank = +sq[1], flip = T.side === "b"; return { col: flip ? 7 - f : f, row: flip ? rank - 1 : 8 - rank }; }
function kingSquare(color) {
  for (const f of FILES) for (let r = 1; r <= 8; r++) { const p = T.game.get(f + r); if (p && p.type === "k" && p.color === color) return f + r; }
  return null;
}
function threatsOf(sq, color) {
  const parts = T.game.fen().split(" "); parts[1] = color; parts[3] = "-";
  const g = new Chess();
  if (!g.load(parts.join(" "))) return [];
  return g.moves({ square: sq, verbose: true }).filter(m => m.flags.indexOf("c") >= 0 || m.flags.indexOf("e") >= 0)
    .map(m => m.to).filter(t => { const p = g.get(t); return p && p.type !== "k"; });
}
function renderBoard() {
  const g = T.game;
  const chk = g.in_check() ? kingSquare(g.turn()) : null;
  for (const sq in T.sqEls) {
    const el = T.sqEls[sq];
    let cls = el.dataset.base;
    if (T.last && (sq === T.last.from || sq === T.last.to)) cls += " last";
    if (sq === T.selected) cls += " sel";
    if (T.targets.includes(sq)) cls += " tgt" + (g.get(sq) ? " cap" : "");
    if (sq === chk) cls += " chk";
    if (sq === T.badSq) cls += " bad";
    el.className = cls;
    const p = g.get(sq), code = p ? p.color + p.type : "";
    let pc = el.querySelector(".pc");
    if (!code) { if (pc) pc.remove(); }
    else if (!pc || pc.dataset.code !== code) {
      if (pc) pc.remove();
      pc = document.createElement("span");
      pc.className = `pc c-${p.color} t-${p.type}`; pc.dataset.code = code;
      el.appendChild(pc);
    }
  }
}
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animate(from, to) {
  const pc = T.sqEls[to] && T.sqEls[to].querySelector(".pc");
  if (!pc || reduceMotion) return;
  const a = dispPos(from), b = dispPos(to);
  pc.style.transition = "none"; pc.style.zIndex = 10;
  pc.style.transform = `translate(${(a.col - b.col) * 100}%, ${(a.row - b.row) * 100}%)`;
  void pc.offsetWidth;
  pc.style.transition = "transform 200ms cubic-bezier(.2,.7,.3,1)"; pc.style.transform = "";
  setTimeout(() => { pc.style.zIndex = ""; pc.style.transition = ""; }, 240);
}
function flashBad(sq) {
  T.badSq = sq; renderBoard();
  setTimeout(() => { if (T && T.badSq === sq) { T.badSq = null; renderBoard(); } }, 450);
}
function arrowSVG(from, to, lineCls, headCls, head, hw, shrink) {
  const a = dispPos(from), b = dispPos(to);
  const x1 = a.col + .5, y1 = a.row + .5, x2 = b.col + .5, y2 = b.row + .5;
  const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  const tx = x2 - ux * shrink, ty = y2 - uy * shrink;
  const bx = tx - ux * head, by = ty - uy * head, px = -uy, py = ux;
  return `<line class="${lineCls}" x1="${x1 + ux * .2}" y1="${y1 + uy * .2}" x2="${bx}" y2="${by}"/><polygon class="${headCls}" points="${tx},${ty} ${bx + px * hw},${by + py * hw} ${bx - px * hw},${by - py * hw}"/>`;
}
function renderOverlay() {
  const svg = document.getElementById("arrows");
  let out = "";
  const focus = new Set(T.done ? [] : T.focus);
  if (!T.done && T.arrowNow && canMove()) squaresIn(T.nodes[T.ply].note).forEach(s => focus.add(s));
  focus.forEach(s => { const p = dispPos(s); out += `<circle class="fo-c" cx="${p.col + .5}" cy="${p.row + .5}" r=".43"/>`; });
  if (T.last && !T.done) T.threats.forEach(t => { out += arrowSVG(T.last.to, t, "th-l", "th-h", .22, .13, .28); });
  if (!T.done && T.arrowNow && canMove()) { const m = T.nodes[T.ply]; out += arrowSVG(m.from, m.to, "ar-l", "ar-h", .42, .26, 0); }
  svg.innerHTML = out;
}

/* ---------- Input ---------- */
function canMove() { return T && !T.done && !T.pending && T.ply < T.nodes.length && T.game.turn() === T.side; }
function sqAt(e) {
  const r = document.getElementById("board").getBoundingClientRect();
  const col = Math.floor((e.clientX - r.left) / r.width * 8), row = Math.floor((e.clientY - r.top) / r.height * 8);
  if (col < 0 || col > 7 || row < 0 || row > 7) return null;
  const flip = T.side === "b";
  return FILES[flip ? 7 - col : col] + (flip ? row + 1 : 8 - row);
}
function onDown(e) {
  if (!canMove()) return;
  const sq = sqAt(e); if (!sq) return;
  e.preventDefault();
  if (T.selected && T.targets.includes(sq)) { userTry(T.selected, sq, true); return; }
  const p = T.game.get(sq);
  if (p && p.color === T.side) {
    T.selected = sq;
    T.targets = T.game.moves({ square: sq, verbose: true }).map(m => m.to);
    renderBoard();
    const pc = T.sqEls[sq].querySelector(".pc");
    T.drag = { from: sq, x: e.clientX, y: e.clientY, pc, active: false };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (T.selected) { T.selected = null; T.targets = []; renderBoard(); }
}
function onMoveP(e) {
  const d = T && T.drag; if (!d || !d.pc) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (!d.active && Math.hypot(dx, dy) > 5) { d.active = true; d.pc.classList.add("dragging"); }
  if (d.active) d.pc.style.transform = `translate(${dx}px, ${dy}px)`;
}
function onUp(e) {
  const d = T && T.drag; if (!d) return;
  T.drag = null;
  if (!d.active) return;
  d.pc.classList.remove("dragging"); d.pc.style.transform = "";
  const sq = sqAt(e);
  if (sq && sq !== d.from && T.targets.includes(sq)) userTry(d.from, sq, false);
  else if (sq !== d.from) { T.selected = null; T.targets = []; renderBoard(); }
}
function onCancel() { const d = T && T.drag; if (!d) return; T.drag = null; if (d.pc) { d.pc.classList.remove("dragging"); d.pc.style.transform = ""; } }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-tab],[data-filter]");
  if (!b || !T) return;
  if (b.dataset.tab) { T.tab = b.dataset.tab; renderTab(); return; }
  if (b.dataset.filter) { T.filter = b.dataset.filter; renderTab(); return; }
  const act = b.dataset.act;
  if (act === "next") startRep();
  else if (act === "restart") startRep(T.line);
  else if (act === "hint") hint();
  else if (act === "practice") { const l = ALL_LINES.find(x => x.id === b.dataset.id); if (l) startRep(l); }
  else if (act === "reset") {
    if (!T.resetArmed) { T.resetArmed = true; b.textContent = "Tap again to reset"; setTimeout(() => { if (T) { T.resetArmed = false; renderTab(); } }, 3000); return; }
    T.resetArmed = false;
    D[T.line.op.id].nodes.forEach(n => delete K[n.id]); reps[T.line.op.id] = 0; save();
    startRep();
  }
});
document.addEventListener("keydown", e => {
  if (!T || e.target.closest("input,textarea")) return;
  if (e.key === "Enter" && T.done) { e.preventDefault(); startRep(); }
  else if ((e.key === "h" || e.key === "H") && !e.metaKey && !e.ctrlKey) hint();
});

/* ---------- Routing and start-up ---------- */
function route() {
  const h = location.hash.slice(1);
  if (OPS[h]) openTrainer({ op: OPS[h] });
  else if (h === "mix-all") openTrainer({ mix: "all" });
  else if (h === "mix-white") openTrainer({ mix: "w" });
  else if (h === "mix-black") openTrainer({ mix: "b" });
  else renderHome();
  window.scrollTo(0, 0);
}
async function init() {
  app.innerHTML = `<div class="wrap"><p class="muted" style="padding-block:40px">Loading the opening trees…</p></div>`;
  load();
  let trees = null;
  try { const r = await fetch("trees.json", { cache: "no-cache" }); if (r.ok) trees = await r.json(); } catch (e) { trees = null; }
  const byId = {}; (trees || []).forEach(t => { byId[t.id] = t; });
  CHECK.source = trees ? "engine" : "curated";
  for (const op of OPENINGS) {
    OPS[op.id] = op;
    const tree = byId[op.id] ? byId[op.id].tree : curatedTree(op);
    D[op.id] = buildOpening(op, tree);
    D[op.id].engine = !!byId[op.id];
    // the opening's defining moves (e.g. 1.e4 in the Sicilian) are fixed, not a choice the opponent made
    if (byId[op.id]) { const pre = byId[op.id].prefix || 0; D[op.id].lines.forEach(l => l.nodes.forEach(n => { if (n.ply <= pre) n.forced = true; })); }
    ALL_LINES.push(...D[op.id].lines);
  }
  CHECK.lines = ALL_LINES.length;
  CHECK.positions = Object.values(D).reduce((a, d) => a + d.userNodes.length, 0);
  if (CHECK.errors.length) CHECK.errors.forEach(e => console.error("[Opening Reps check]", e));
  console.log(`[Opening Reps check] source=${CHECK.source} lines=${CHECK.lines} positions=${CHECK.positions} errors=${CHECK.errors.length}`);
  window.__openingCheck = CHECK;
  window.addEventListener("hashchange", route);
  route();
}
(function boot() {
  if (typeof Chess !== "undefined") return init();
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js";
  s.onload = init;
  s.onerror = () => { app.innerHTML = `<div class="wrap"><div class="err">The chess engine didn't load. Check your connection and reload the page.</div></div>`; };
  document.head.appendChild(s);
})();
</script>
